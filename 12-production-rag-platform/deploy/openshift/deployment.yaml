apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-rag-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-rag-platform
  template:
    metadata:
      labels:
        app: production-rag-platform
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/your-project/production-rag-platform:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
